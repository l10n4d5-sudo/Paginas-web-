<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #222;
            text-align: center;
            padding: 60px 20px;
        }

        .tarjeta {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px #0001;
        }

        h1 {
            color: #2563eb;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>¡Mi primera página web!</h1>
        <p>Estoy aprendiendo a crear y publicar páginas web.</p>
        <p>Pronto podré crear webs para negocios.</p>
        <a href="https://github.com/">Visitar GitHub</a>
    </div>
</body>
</html>
